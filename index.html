<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lo más Top</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ============================================================
     DETECCIÓN TEMPRANA DE RENDIMIENTO
     ============================================================ -->
<script>
(function(){
  try{
    var lite = false;
    var hc = navigator.hardwareConcurrency || 4;
    var dm = navigator.deviceMemory || 4;
    if(hc <= 4) lite = true;
    if(dm <= 4) lite = true;
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if(conn){
      if(conn.saveData) lite = true;
      var et = conn.effectiveType || '';
      if(et === 'slow-2g' || et === '2g' || et === '3g') lite = true;
    }
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) lite = true;
    if(lite) document.documentElement.setAttribute('data-perf', 'lite');
  }catch(e){}
})();
</script>

<style>

  /* ================= TOKENS ================= */
  :root{
    --bg:#FBF3EA;
    --surface:#FFFFFF;
    --panel:#FFFFFF;
    --text:#211A12;
    --text-muted:#7A6C5D;
    --accent:#E8620C;
    --accent-2:#B8430A;
    --accent-soft:#FBE3D0;
    --on-accent:#1B0E04;
    --border-strong:#F0C29B;
    --shadow: 0 2px 4px rgba(33,26,18,0.05), 0 14px 30px -16px rgba(33,26,18,0.14);
    --shadow-lift: 0 6px 12px rgba(33,26,18,0.06), 0 32px 60px -24px rgba(33,26,18,0.28);
    --glass: rgba(255,255,255,0.72);
    --grid-line: rgba(33,26,18,0.055);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E0A06;
      --surface:#171310;
      --panel:#171310;
      --text:#F7ECDD;
      --text-muted:#B6A48D;
      --shadow: 0 2px 4px rgba(0,0,0,0.4), 0 18px 40px -18px rgba(0,0,0,0.8);
      --shadow-lift: 0 8px 18px rgba(0,0,0,0.5), 0 40px 80px -30px rgba(0,0,0,0.9);
      --glass: rgba(23,19,16,0.66);
      --grid-line: rgba(255,255,255,0.045);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"]{
    --bg:#0E0A06;
    --surface:#171310;
    --panel:#171310;
    --text:#F7ECDD;
    --text-muted:#B6A48D;
    --shadow: 0 2px 4px rgba(0,0,0,0.4), 0 18px 40px -18px rgba(0,0,0,0.8);
    --shadow-lift: 0 8px 18px rgba(0,0,0,0.5), 0 40px 80px -30px rgba(0,0,0,0.9);
    --glass: rgba(23,19,16,0.66);
    --grid-line: rgba(255,255,255,0.045);
    color-scheme: dark;
  }

  /* ================= BASE ================= */
  *{ box-sizing:border-box; }

  html{ scrollbar-color:var(--accent) transparent; scroll-behavior:smooth; }

  html,body{
    margin:0; padding:0;
    color:var(--text);
    font-family:'Manrope', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeSpeed;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-overflow-scrolling:touch;
  }

  body{
    display:flex;
    justify-content:center;
    min-height:100vh;
    background:
      radial-gradient(620px circle at 10% -8%, var(--accent-soft) 0%, transparent 58%),
      radial-gradient(520px circle at 104% 4%, var(--accent-soft) 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    transition:background-color .5s ease;
  }

  ::selection{ background:var(--accent); color:var(--on-accent); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(var(--accent), var(--accent-2));
    border-radius:8px;
  }

  main{
    position:relative;
    z-index:2;
    width:100%;
    max-width:680px;
    padding:0 20px 90px;
  }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  h1,h2,h3{
    font-family:'Unbounded', system-ui, sans-serif;
    margin:0;
    letter-spacing:-0.01em;
  }

  /* ================= FONDO ÉPICO ================= */
  .aurora{
    position:fixed;
    inset:-25%;
    z-index:-3;
    pointer-events:none;
    filter:blur(90px);
    opacity:.75;
  }
  .aurora i{
    position:absolute;
    display:block;
    border-radius:50%;
    will-change:transform;
  }
  .aurora i:nth-child(1){
    width:48vw; height:48vw; min-width:340px; min-height:340px;
    top:-6%; left:-8%;
    background:var(--accent);
    opacity:.30;
    animation:drift1 22s ease-in-out infinite;
  }
  .aurora i:nth-child(2){
    width:42vw; height:42vw; min-width:300px; min-height:300px;
    top:22%; right:-12%;
    background:var(--accent-2);
    opacity:.24;
    animation:drift2 26s ease-in-out infinite;
  }
  .aurora i:nth-child(3){
    width:38vw; height:38vw; min-width:280px; min-height:280px;
    bottom:-10%; left:26%;
    background:var(--accent);
    opacity:.16;
    animation:drift3 30s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(9vw,7vh,0) scale(1.18); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate3d(0,0,0) scale(1.05); }
    50%{ transform:translate3d(-11vw,10vh,0) scale(.86); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate3d(0,0,0) scale(.95); }
    50%{ transform:translate3d(7vw,-9vh,0) scale(1.2); }
  }

  #fx{
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
    opacity:.85;
  }

  .grid-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 78%);
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 78%);
  }

  .spotlight{
    position:fixed;
    top:0; left:0;
    width:520px; height:520px;
    margin:-260px 0 0 -260px;
    border-radius:50%;
    pointer-events:none;
    z-index:1;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 65%);
    opacity:0;
    transition:opacity .4s ease;
    will-change:transform;
  }
  .spotlight.on{ opacity:1; }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    .spotlight{
      background:radial-gradient(circle, rgba(232,98,12,0.14) 0%, transparent 65%);
    }
  }

  /* ================= LOADER ================= */
  .loader{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    transition:opacity .55s ease, visibility .55s ease;
  }
  .loader.done{ opacity:0; visibility:hidden; }
  .loader-inner{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .loader-flame{
    font-size:44px;
    display:block;
    animation:loaderPulse 1s ease-in-out infinite;
    filter:drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 70%, transparent));
  }
  @keyframes loaderPulse{
    0%,100%{ transform:scale(1) rotate(-4deg); }
    50%{ transform:scale(1.18) rotate(4deg); }
  }
  .loader-bar{
    width:150px; height:4px;
    border-radius:99px;
    background:var(--accent-soft);
    overflow:hidden;
  }
  .loader-bar i{
    display:block; height:100%; width:40%;
    border-radius:99px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    animation:loaderSlide 1.05s cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes loaderSlide{
    0%{ transform:translateX(-110%); }
    100%{ transform:translateX(300%); }
  }

  /* ================= CONTROLES ================= */
  .controls-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    padding:22px 2px 0;
  }

  .theme-toggle,
  .color-btn{
    width:46px; height:46px;
    border-radius:16px;
    border:1.5px solid var(--border-strong);
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
    font-size:19px; line-height:1;
    color:var(--text);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .2s ease, box-shadow .25s ease;
  }
  .theme-toggle:hover,
  .color-btn:hover{
    transform:translateY(-2px) scale(1.06);
    border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow);
  }
  .theme-toggle:active,
  .color-btn:active{ transform:scale(.9); }
  .theme-toggle:focus-visible,
  .color-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  #themeIcon{ display:block; transition:transform .45s cubic-bezier(.34,1.56,.64,1); }
  .theme-toggle:hover #themeIcon{ transform:rotate(24deg) scale(1.12); }

  .color-picker{ position:relative; }

  .color-btn-dot{
    width:19px; height:19px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink:0;
    box-shadow:0 0 12px color-mix(in srgb, var(--accent) 70%, transparent);
  }

  .color-popover{
    position:absolute; top:calc(100% + 10px); right:0;
    display:flex; flex-direction:column; align-items:center;
    gap:12px; padding:15px 12px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    border:1px solid var(--border-strong);
    border-radius:999px;
    box-shadow:var(--shadow-lift);
    opacity:0;
    transform:translateY(-8px) scale(.9);
    pointer-events:none;
    transform-origin:top right;
    transition:opacity .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
    z-index:40;
  }
  .color-popover[data-open="true"]{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

  .swatch{
    width:24px; height:24px; border-radius:50%;
    border:none;
    box-shadow:0 0 0 1px color-mix(in srgb, var(--text) 18%, transparent);
    cursor:pointer; padding:0;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  }
  .swatch:hover{ transform:scale(1.22); }
  .swatch:active{ transform:scale(.88); }
  .swatch:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }
  .swatch[data-active="true"]{
    box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px currentColor, 0 0 16px currentColor;
    transform:scale(1.16);
  }
  .swatch[data-color="naranja"]{ background:#E8620C; color:#E8620C; }
  .swatch[data-color="azul"]{ background:#2159D9; color:#2159D9; }
  .swatch[data-color="rojo"]{ background:#DC2F2F; color:#DC2F2F; }
  .swatch[data-color="verde"]{ background:#188A4C; color:#188A4C; }
  .swatch[data-color="amarillo"]{ background:#E4B400; color:#E4B400; }
  .swatch[data-color="rosado"]{ background:#E8368F; color:#E8368F; }

  /* Fallback sin color-mix */
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    .swatch{ box-shadow:0 0 0 1px rgba(0,0,0,0.15); }
    .swatch[data-active="true"]{
      box-shadow:0 0 0 2px var(--surface), 0 0 0 4px currentColor;
    }
    .theme-toggle:hover,
    .color-btn:hover{
      box-shadow:0 0 0 3px rgba(0,0,0,0.08), var(--shadow);
    }
    .color-btn-dot{ box-shadow:none; }
  }

  /* Fallback sin backdrop-filter */
  @supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
    .theme-toggle,
    .color-btn{ background:var(--surface); }
    .color-popover{ background:var(--surface); }
  }

  /* ================= HERO ================= */
  .hero{
    position:relative;
    padding:34px 4px 0;
    cursor:pointer;
    user-select:none;
  }

  .hero::before{
    content:"";
    position:absolute;
    top:-70px; left:-60px;
    width:300px; height:300px;
    border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent) 0%, transparent 68%);
    z-index:-1;
    animation:heroHalo 7s ease-in-out infinite;
  }
  @keyframes heroHalo{
    0%,100%{ transform:scale(1); opacity:.8; }
    50%{ transform:scale(1.14); opacity:1; }
  }

  .hero-inner{
    opacity:0;
    transform:translateY(16px);
    animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .hero-inner.loaded{ animation:none; opacity:1; transform:none; }
  .hero-inner.loaded.pulse{ animation:heroElegant .6s cubic-bezier(.22,1,.36,1); }

  @keyframes heroElegant{
    0%{ transform:translateY(0) scale(1); }
    40%{ transform:translateY(-6px) scale(1.022); }
    100%{ transform:translateY(0) scale(1); }
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .hero h1{
    font-size:clamp(42px, 11.5vw, 76px);
    font-weight:900;
    color:var(--text);
    line-height:1;
    letter-spacing:-0.035em;
  }

  .hero h1 .top{
    position:relative;
    display:inline-block;
    background-image:linear-gradient(100deg, var(--accent), var(--accent-2), var(--accent), var(--accent-2));
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shimmer 5s linear infinite;
    filter:drop-shadow(0 0 26px color-mix(in srgb, var(--accent) 45%, transparent));
  }
  @keyframes shimmer{ to{ background-position:-300% 0; } }

  .hero p{
    margin:16px 0 0;
    color:var(--text-muted);
    font-size:16px;
    font-weight:600;
    max-width:40ch;
    min-height:1.5em;
    transition:color .2s ease;
  }
  .hero p .caret{
    display:inline-block;
    width:2px;
    height:1em;
    margin-left:2px;
    background:var(--accent);
    vertical-align:-0.12em;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .hero-bar{
    height:5px; border-radius:99px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    margin-top:22px;
    width:54px;
    animation:growBar .9s cubic-bezier(.2,.8,.2,1) .3s both;
    transition:box-shadow .3s ease;
    box-shadow:0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  @keyframes growBar{ from{ width:0; opacity:0; } to{ width:54px; opacity:1; } }

  /* Fallback */
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    .hero h1 .top{ filter:none; }
    .hero-bar{ box-shadow:none; }
    .hero::before{ background:radial-gradient(circle, rgba(232,98,12,0.18) 0%, transparent 68%); }
  }

  /* ================= SECCIONES ================= */
  .sections-grid{ display:block; margin-top:28px; }

  section.group{
    position:relative;
    margin-top:28px;
    padding:26px 18px 22px;
    /* Fondo muy opaco (casi sólido) */
    background:var(--panel);
    border:1px solid var(--border-strong);
    border-radius:28px;
    box-shadow:var(--shadow);
    contain:layout paint style;
    content-visibility:auto;
    contain-intrinsic-size:auto 320px;
    opacity:0;
    transform:translateY(26px);
    transition:opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease;
  }
  /* Un toque mínimo del acento, pero prácticamente opaco */
  @supports (background: color-mix(in srgb, red 50%, blue)) {
    section.group{
      background:color-mix(in srgb, var(--panel) 98%, var(--accent) 2%);
    }
  }

  .sections-grid > section.group:first-child{ margin-top:0; }

  section.group.in{ opacity:1; transform:none; }

  section.group::before{
    content:"";
    position:absolute; top:0; left:22px; right:22px; height:3px;
    border-radius:0 0 99px 99px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity:.9;
    box-shadow:0 0 18px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    section.group::before{ box-shadow:none; }
  }

  section.group::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:28px;
    pointer-events:none;
    background:radial-gradient(420px circle at var(--gx,50%) var(--gy,0%), rgba(232,98,12,0.08), transparent 62%);
    opacity:0;
    transition:opacity .35s ease;
  }
  section.group:hover::after{ opacity:1; }

  .group-title{
    position:relative;
    display:flex; align-items:center; gap:12px;
    margin:0 2px 18px;
  }

  .group-title .badge{
    width:42px; height:42px; border-radius:14px;
    background:var(--accent-soft);
    border:1px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
    box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent);
  }
  section.group:hover .badge{
    transform:rotate(-8deg) scale(1.1);
    box-shadow:0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  .group-title h2{
    font-size:20px; font-weight:800; color:var(--text);
    flex:1;
    letter-spacing:-0.02em;
  }

  /* ================= TARJETAS ================= */
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:20px;
    overflow:hidden;
    transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease, border-color .3s ease;
    transform-style:preserve-3d;
  }
  @supports (background: color-mix(in srgb, red 50%, blue)) {
    .card{ background:color-mix(in srgb, var(--surface) 94%, transparent); }
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .card{
      background:linear-gradient(150deg, rgba(0,0,0,.92) 0%, #1A1613 100%);
    }
    @supports (background: color-mix(in srgb, red 50%, blue)) {
      :root:not([data-theme="light"]) .card{
        background:linear-gradient(150deg, rgba(0,0,0,.92) 0%, color-mix(in srgb, rgba(0,0,0,.92) 88%, var(--accent) 12%) 100%);
      }
    }
  }
  :root[data-theme="dark"] .card{
    background:linear-gradient(150deg, rgba(0,0,0,.92) 0%, #1A1613 100%);
  }
  @supports (background: color-mix(in srgb, red 50%, blue)) {
    :root[data-theme="dark"] .card{
      background:linear-gradient(150deg, rgba(0,0,0,.92) 0%, color-mix(in srgb, rgba(0,0,0,.92) 88%, var(--accent) 12%) 100%);
    }
  }

  .card > *{ position:relative; z-index:1; }

  .card::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(232,98,12,0.18), transparent 70%);
    opacity:0;
    transition:opacity .3s ease;
  }
  .card:hover::after{ opacity:1; }
  .card:hover{
    border-color:var(--accent);
    box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), var(--shadow-lift);
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    .card:hover{ box-shadow:var(--shadow-lift); }
  }

  /* ================= FILAS ================= */
  .row{
    position:relative;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    min-height:56px;
    padding:15px 18px;
    border-bottom:1px solid var(--border-strong);
    transition:background-color .2s ease, padding-left .25s cubic-bezier(.2,.7,.2,1);
    overflow:hidden;
  }
  .row:last-child{ border-bottom:none; }

  .row::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    transform:scaleY(0);
    transform-origin:center;
    transition:transform .3s cubic-bezier(.2,.7,.2,1);
  }
  a.row:hover::before, a.row:focus-visible::before{ transform:scaleY(1); }

  a.row:hover, a.row:focus-visible{
    background:var(--accent-soft);
    padding-left:24px;
  }
  a.row:focus-visible{ outline:2px solid var(--accent); outline-offset:-3px; }

  .row-name{
    font-size:16px; font-weight:700;
    display:inline-block;
    transition:color .2s ease;
  }

  .copy-btn::after{
    content:"";
    position:absolute;
    top:0; left:-120%;
    width:60%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.42), transparent);
    transform:skewX(-18deg);
    transition:left .6s cubic-bezier(.2,.7,.2,1);

  .copy-btn:hover{

  .copy-btn:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }

  .footer-inner{
    position:relative;

  .footer-inner.loaded.pulse{ animation:clickPulse .65s cubic-bezier(.34,1.56,.64,1); }
  @keyframes clickPulse{
    0%{ transform:scale(1) rotate(0deg); }
    22%{ transform:scale(1.09) rotate(-2.5deg); }
    46%{ transform:scale(.94) rotate(2.5deg); }
    70%{ transform:scale(1.035) rotate(-1deg); }
    100%{ transform:scale(1) rotate(0deg); }

  .footer-flame-wrap{
    position:relative;
    width:58px; height:58px;
    display:flex; align-items:center; justify-content:center;
  }
  .footer-flame-wrap::before{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(circle, rgba(232,98,12,0.28) 0%, transparent 70%);

  }

  .footer-flame{
    position:relative; z-index:1;
    font-size:27px;
    display:inline-block;
    animation:bounce 2s ease-in-out infinite;
    filter:drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 60%, transparent));

  @keyframes bounce{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-8px) scale(1.1); }

  [data-perf="lite"] .copy-btn::after{ display:none; }
  [data-perf="lite"] .copy-btn:hover{ filter:none; }

    opacity:1 !important;
    transform:none !important;
    transition:none !important;

    #fx{ display:none; }
    .spotlight{ display:none; }
  }

      </div>
    </div>
  </footer>

</main>

<button class="back-to-top" id="backToTop" type="button" aria-label="Volver arriba" data-visible="false">↑</button>

<script>
/* =========================================================
   0. UTILIDADES + DETECCIÓN LITE
   ========================================================= */
var LITE = document.documentElement.getAttribute('data-perf') === 'lite';
var REDUCE_MQ = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var REDUCE = REDUCE_MQ || LITE;
var FINE_POINTER = !LITE && window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
var root = document.documentElement;

function hexToRgb(hex){
  hex = (hex || '').trim().replace('#','');
  if(hex.length === 3) hex = hex.split('').map(function(c){ return c + c; }).join('');
  var n = parseInt(hex, 16);
  if(isNaN(n)) return {r:232,g:98,b:12};
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function cssVar(name){
  return getComputedStyle(root).getPropertyValue(name).trim();
}
function accentRGB(){ return hexToRgb(cssVar('--accent') || '#E8620C'); }
function accent2RGB(){ return hexToRgb(cssVar('--accent-2') || '#B8430A'); }

/* =========================================================
   1. TEMA + PALETAS
   ========================================================= */
(function(){
  var toggle = document.getElementById('themeToggle');
  var icon = document.getElementById('themeIcon');
  var colorPicker = document.getElementById('colorPicker');
  var colorBtn = document.getElementById('colorBtn');
  var colorPopover = document.getElementById('colorPopover');
  var swatches = document.querySelectorAll('.swatch');

  var PALETTES = {
    naranja:  { light:{accent:'#E8620C', accent2:'#B8430A', soft:'#FBE3D0', border:'#F0C29B', onAccent:'#1B0E04', bg:'#FBF3EA'}, dark:{accent:'#FF8A3D', accent2:'#FFB26B', soft:'#3B2413', border:'#5C3A1F', onAccent:'#1B0E04', bg:'#0E0A06'} },
    azul:     { light:{accent:'#2159D9', accent2:'#173F9E', soft:'#E1EAFC', border:'#AEC7F7', onAccent:'#FFFFFF', bg:'#EEF4FE'}, dark:{accent:'#6FA8FF', accent2:'#9CC5FF', soft:'#1B2C4D', border:'#2C4573', onAccent:'#0B172E', bg:'#070F1F'} },
    rojo:     { light:{accent:'#DC2F2F', accent2:'#A81F1F', soft:'#FBE3E3', border:'#F3B8B8', onAccent:'#FFFFFF', bg:'#FDF0EE'}, dark:{accent:'#FF6B6B', accent2:'#FF9A9A', soft:'#45191A', border:'#5C2323', onAccent:'#2B0A0A', bg:'#170606'} },
    verde:    { light:{accent:'#188A4C', accent2:'#0F6B39', soft:'#DFF5E7', border:'#B7E8C9', onAccent:'#FFFFFF', bg:'#EFFAF2'}, dark:{accent:'#4ADE80', accent2:'#7CEBAA', soft:'#153A26', border:'#1D5636', onAccent:'#062814', bg:'#04140C'} },
    amarillo: { light:{accent:'#C99A02', accent2:'#8C6A00', soft:'#FBF0CB', border:'#F0DA98', onAccent:'#241900', bg:'#FFFAEA'}, dark:{accent:'#FFD34D', accent2:'#FFE08A', soft:'#463610', border:'#5C4A12', onAccent:'#241900', bg:'#150F03'} },
    rosado:   { light:{accent:'#E8368F', accent2:'#B81F6C', soft:'#FDE3F0', border:'#F5B8DA', onAccent:'#FFFFFF', bg:'#FEF1F8'}, dark:{accent:'#FF7AC0', accent2:'#FFA8D6', soft:'#3E1730', border:'#5C2340', onAccent:'#2B0A1D', bg:'#170512'} }
  };

  var currentAccent = 'naranja';

  function systemPrefersDark(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function effectiveTheme(){
    var manual = root.getAttribute('data-theme');
    if(manual === 'dark' || manual === 'light') return manual;
    return systemPrefersDark() ? 'dark' : 'light';
  }
  function updateIcon(){
    icon.textContent = effectiveTheme() === 'dark' ? '☀️' : '🌙';
  }

  function applyAccent(name){
    if(!PALETTES[name]) name = 'naranja';
    currentAccent = name;
    var p = PALETTES[name][effectiveTheme() === 'dark' ? 'dark' : 'light'];
    root.style.setProperty('--accent', p.accent);
    root.style.setProperty('--accent-2', p.accent2);
    root.style.setProperty('--accent-soft', p.soft);
    root.style.setProperty('--border-strong', p.border);
    root.style.setProperty('--on-accent', p.onAccent);
    root.style.setProperty('--bg', p.bg);
    swatches.forEach(function(s){
      s.setAttribute('data-active', s.getAttribute('data-color') === name ? 'true' : 'false');
    });
    window.dispatchEvent(new CustomEvent('accentchange'));
  }

  function openPopover(open){
    colorPopover.setAttribute('data-open', open ? 'true' : 'false');
    colorBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function applyStoredPrefs(){
    try{
      var savedTheme = localStorage.getItem('lomastop-theme');
      if(savedTheme === 'dark' || savedTheme === 'light'){
        root.setAttribute('data-theme', savedTheme);
      }
      var savedAccent = localStorage.getItem('lomastop-accent');
      if(savedAccent && PALETTES[savedAccent]) currentAccent = savedAccent;
    }catch(e){}
    updateIcon();
    applyAccent(currentAccent);
  }

  toggle.addEventListener('click', function(){
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('lomastop-theme', next); }catch(e){}
    updateIcon();
    applyAccent(currentAccent);
  });

  colorBtn.addEventListener('click', function(e){
    e.stopPropagation();
    openPopover(colorPopover.getAttribute('data-open') !== 'true');
  });

  document.addEventListener('click', function(e){
    if(!colorPicker.contains(e.target)) openPopover(false);
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') openPopover(false);
  });

  swatches.forEach(function(btn){
    btn.addEventListener('click', function(){
      var color = btn.getAttribute('data-color');
      applyAccent(color);
      try{ localStorage.setItem('lomastop-accent', color); }catch(e){}
      openPopover(false);
    });
  });

  if(window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var handler = function(){
      if(!root.getAttribute('data-theme')){
        updateIcon();
        applyAccent(currentAccent);
      }
    };
    if(mq.addEventListener) mq.addEventListener('change', handler);
    else if(mq.addListener) mq.addListener(handler);
  }

  applyStoredPrefs();
  window.__applyAccent = applyAccent;
})();

/* =========================================================
   2. FONDO DE PARTÍCULAS (solo en modo full)
   ========================================================= */
(function(){
  if(LITE) return;
  var canvas = document.getElementById('fx');
  if(!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, particles = [], raf = null, running = true;
  var mouse = { x:-9999, y:-9999 };
  var c1 = accentRGB(), c2 = accent2RGB();

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build(){
    var target = Math.min(80, Math.max(26, Math.round((W * H) / 24000)));
    particles = [];
    for(var i = 0; i < target; i++){
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.32,
        vy: (Math.random() - 0.5) * 0.32,
        r: Math.random() * 1.9 + 0.7,
        t: Math.random()
      });
    }
  }

  function step(){
    if(!running) return;
    ctx.clearRect(0, 0, W, H);

    var i, j, p, q, dx, dy, d2, d, alpha;

    for(i = 0; i < particles.length; i++){
      p = particles[i];
      p.x += p.vx;
      p.y += p.vy;

      if(p.x < -20) p.x = W + 20;
      if(p.x > W + 20) p.x = -20;
      if(p.y < -20) p.y = H + 20;
      if(p.y > H + 20) p.y = -20;

      dx = p.x - mouse.x;
      dy = p.y - mouse.y;
      d2 = dx * dx + dy * dy;
      if(d2 < 20000 && d2 > 0.01){
        d = Math.sqrt(d2);
        var force = (1 - d / 141) * 0.9;
        p.x += (dx / d) * force;
        p.y += (dy / d) * force;
      }
    }

    for(i = 0; i < particles.length; i++){
      p = particles[i];
      for(j = i + 1; j < particles.length; j++){
        q = particles[j];
        dx = p.x - q.x;
        dy = p.y - q.y;
        d2 = dx * dx + dy * dy;
        if(d2 < 17000){
          alpha = (1 - d2 / 17000) * 0.22;
          ctx.strokeStyle = 'rgba(' + c1.r + ',' + c1.g + ',' + c1.b + ',' + alpha.toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }

    for(i = 0; i < particles.length; i++){
      p = particles[i];
      var col = p.t > 0.72 ? c2 : c1;
      ctx.fillStyle = 'rgba(' + col.r + ',' + col.g + ',' + col.b + ',0.55)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    raf = requestAnimationFrame(step);
  }

  window.addEventListener('resize', function(){
    clearTimeout(canvas._rt);
    canvas._rt = setTimeout(resize, 160);
  });

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  }, { passive:true });

  window.addEventListener('mouseout', function(){ mouse.x = mouse.y = -9999; });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      running = false;
      if(raf) cancelAnimationFrame(raf);
      raf = null;
    } else if(!REDUCE){
      running = true;
      raf = requestAnimationFrame(step);
    }
  });

  window.addEventListener('accentchange', function(){
    c1 = accentRGB();
    c2 = accent2RGB();
  });

  resize();
  if(REDUCE){
    running = false;
    step();
    running = false;
    if(raf) cancelAnimationFrame(raf);
    raf = null;
  } else {
    raf = requestAnimationFrame(step);
  }
})();

/* =========================================================
   3. SPOTLIGHT DEL CURSOR (solo full)
   ========================================================= */
(function(){
  if(LITE) return;
  var el = document.getElementById('spotlight');
  if(!el || !FINE_POINTER || REDUCE) return;
  var tx = 0, ty = 0, cx = 0, cy = 0, started = false;

  window.addEventListener('mousemove', function(e){
    tx = e.clientX;
    ty = e.clientY;
    if(!started){
      started = true;
      cx = tx; cy = ty;
      el.classList.add('on');
      loop();
    }
  }, { passive:true });

  document.addEventListener('mouseleave', function(){ el.classList.remove('on'); started = false; });

  function loop(){
    if(!started) return;
    cx += (tx - cx) * 0.14;
    cy += (ty - cy) * 0.14;
    el.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
    requestAnimationFrame(loop);
  }
})();

/* =========================================================
   4. LOADER
   ========================================================= */
(function(){
  var loader = document.getElementById('loader');
  if(!loader) return;
  function finish(){
    loader.classList.add('done');
    document.body.style.overflow = '';
    setTimeout(function(){ if(loader.parentNode) loader.parentNode.removeChild(loader); }, 700);
  }
  document.body.style.overflow = 'hidden';
  var done = false;
  function once(){ if(done) return; done = true; finish(); }
  var delay = LITE ? 120 : 420;
  var hardLimit = LITE ? 900 : 2600;
  if(document.readyState === 'complete') setTimeout(once, delay);
  else window.addEventListener('load', function(){ setTimeout(once, delay); });
  setTimeout(once, hardLimit);
})();

/* =========================================================
   5. VOLVER ARRIBA
   ========================================================= */
(function(){
  var btn = document.getElementById('backToTop');
  var ticking = false;

  function update(){
    if(btn) btn.setAttribute('data-visible', window.scrollY > 420 ? 'true' : 'false');
    ticking = false;
  }

  window.addEventListener('scroll', function(){
    if(!ticking){
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive:true });
  window.addEventListener('resize', update, { passive:true });
  update();

  if(btn){
    btn.addEventListener('click', function(){
      window.scrollTo({ top:0, behavior: REDUCE ? 'auto' : 'smooth' });
    });
  }
})();

/* =========================================================
   6. REVEAL AL SCROLL
   ========================================================= */
(function(){
  var items = document.querySelectorAll('[data-reveal], .footer-card');

  if(LITE){
    items.forEach(function(el){ el.classList.add('in'); });
    return;
  }
  if(!('IntersectionObserver' in window)){
    items.forEach(function(el){ el.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold:0.08, rootMargin:'0px 0px -8% 0px' });

  items.forEach(function(el, i){
    el.style.transitionDelay = Math.min(i * 60, 240) + 'ms';
    io.observe(el);
  });
})();

/* =========================================================
   7. TILT 3D + GLOW (solo full)
   ========================================================= */
(function(){
  if(LITE || !FINE_POINTER || REDUCE) return;
  var cards = document.querySelectorAll('.card');

  cards.forEach(function(card){
    var rect = null;
    var rafId = null;
    var rx = 0, ry = 0, trx = 0, tryy = 0;

    function animate(){
      rx += (trx - rx) * 0.16;
      ry += (tryy - ry) * 0.16;
      card.style.transform = 'perspective(900px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
      if(Math.abs(trx - rx) > 0.02 || Math.abs(tryy - ry) > 0.02){
        rafId = requestAnimationFrame(animate);
      } else {
        card.style.transform = 'perspective(900px) rotateX(' + trx.toFixed(2) + 'deg) rotateY(' + tryy.toFixed(2) + 'deg)';
        rafId = null;
      }
    }

    function kick(){ if(!rafId) rafId = requestAnimationFrame(animate); }

    card.addEventListener('mousemove', function(e){
      rect = card.getBoundingClientRect();
      var px = (e.clientX - rect.left) / rect.width;
      var py = (e.clientY - rect.top) / rect.height;

      card.style.setProperty('--mx', (px * 100).toFixed(2) + '%');
      card.style.setProperty('--my', (py * 100).toFixed(2) + '%');

      tryy = (px - 0.5) * 7;
      trx = -(py - 0.5) * 7;
      kick();
    }, { passive:true });

    card.addEventListener('mouseleave', function(){
      trx = 0; tryy = 0;
      kick();
    });
  });

  document.querySelectorAll('section.group').forEach(function(sec){
    sec.addEventListener('mousemove', function(e){
      var r = sec.getBoundingClientRect();
      sec.style.setProperty('--gx', (((e.clientX - r.left) / r.width) * 100).toFixed(2) + '%');
      sec.style.setProperty('--gy', (((e.clientY - r.top) / r.height) * 100).toFixed(2) + '%');
    }, { passive:true });
  });
})();

/* =========================================================
   8. FLECHAS EN LAS FILAS (solo full)
   ========================================================= */
(function(){
  if(LITE) return;
  document.querySelectorAll('a.row').forEach(function(row){
    if(row.querySelector('.row-arrow')) return;
    var arrow = document.createElement('span');
    arrow.className = 'row-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '↗';
    row.appendChild(arrow);
  });
})();

/* =========================================================
   9. EFECTO MÁQUINA DE ESCRIBIR (solo full)
   ========================================================= */
(function(){
  var target = document.getElementById('typeTarget');
  if(!target) return;
  var text = 'Repositorio de módulos, apps y respaldos.';
  if(REDUCE || LITE){ target.textContent = text; return; }
  var i = 0;
  function type(){
    if(i <= text.length){
      target.textContent = text.slice(0, i);
      i++;
      setTimeout(type, 26 + Math.random() * 40);
    }
  }
  setTimeout(type, 850);
})();

/* =========================================================
   10. COPIAR REPOSITORIO
   ========================================================= */
(function(){
  var btn = document.getElementById('copyRepoBtn');
  var label = document.getElementById('copyRepoLabel');
  if(!btn) return;
  var textToCopy = 'https://raw.githubusercontent.com/zarzet/SpotiFLAC-Extension/main/registry.json';
  var resetTimer = null;

  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  function showCopied(){
    btn.setAttribute('data-copied', 'true');
    label.textContent = '¡Copiado!';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(function(){
      btn.setAttribute('data-copied', 'false');
      label.textContent = 'Copiar Repositorio';
    }, 1900);
  }

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(textToCopy).then(showCopied, function(){
        fallbackCopy(textToCopy);
        showCopied();
      });
    } else {
      fallbackCopy(textToCopy);
      showCopied();
    }
  });
})();

/* =========================================================
   11. ANIMACIONES AL PULSAR (hero + pie)
   ========================================================= */
(function(){
  function bounce(el){
    el.classList.add('loaded');
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  var heroEl = document.getElementById('heroEl');
  var heroInner = document.getElementById('heroInner');
  if(heroInner){
    heroInner.addEventListener('animationend', function(e){
      if(e.animationName === 'rise') heroInner.classList.add('loaded');
      if(e.animationName === 'heroElegant') heroInner.classList.remove('pulse');
    });
  }
  if(heroEl && heroInner){
    heroEl.addEventListener('click', function(){ bounce(heroInner); });
  }

  var footerEl = document.getElementById('footerEl');
  var footerInner = document.getElementById('footerInner');
  var footerFlame = document.getElementById('footerFlame');

  if(footerEl && footerInner && footerFlame){
    footerEl.addEventListener('click', function(e){
      bounce(footerInner);
      footerFlame.classList.remove('burst');
      void footerFlame.offsetWidth;
      footerFlame.classList.add('burst');
    });
    footerFlame.addEventListener('animationend', function(e){
      if(e.animationName === 'flameBurst') footerFlame.classList.remove('burst');
    });
  }
})();

/* =========================================================
   12. PARALLAX SUAVE DEL HERO (solo full)
   ========================================================= */
(function(){
  if(LITE || REDUCE || !FINE_POINTER) return;
  var hero = document.querySelector('.hero-inner');
  if(!hero) return;
  var ticking = false;
  window.addEventListener('scroll', function(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var y = window.scrollY;
      if(y < 500){
        hero.style.transform = 'translateY(' + (y * 0.11).toFixed(2) + 'px)';
        hero.style.opacity = Math.max(0, 1 - y / 460).toFixed(3);
      }
      ticking = false;
    });
  }, { passive:true });
})();

</script>
